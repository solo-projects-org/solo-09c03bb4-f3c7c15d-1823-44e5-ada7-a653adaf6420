services:
  catalog:
    build: .
    image: satellite-scene-catalog:latest
    container_name: scene-catalog
    ports:
      - "8000:8000"
    environment:
      CATALOG_DB_PATH: /data/catalog.db
      CATALOG_STORAGE_DIR: /data/storage
    volumes:
      - catalog-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  catalog-data:
